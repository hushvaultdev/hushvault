# HushVault API (Cloudflare Worker)
#
# Layout
#   - Top level        : what `wrangler dev` uses (local D1/KV/DO are simulated;
#                        the "local-dev-unused" IDs are never contacted locally).
#   - [env.dev]        : deployed with `wrangler deploy --env dev`
#   - [env.production] : deployed with `wrangler deploy --env production`
#
# Deploys run on Cloudflare Workers Builds (no GitHub/GitLab CI minutes): one
# Worker per environment, each connected to this repo. See docs/DEPLOYMENT.md.
#
# Bindings (d1_databases, kv_namespaces, durable_objects, vars) and `routes`
# are NON-INHERITABLE: each [env.*] block below declares its own. Anything not
# repeated in an env block is not deployed there.
# https://developers.cloudflare.com/workers/wrangler/environments/
#
# Resource IDs below are identifiers, not credentials. Created 2026-10-01
# (tracked in GitHub issue #21).
#
# SECRETS (never put in this file; set per env with
#   `wrangler secret put <NAME> --env <env>` or in the dashboard under
#   Settings > Variables & Secrets):
#   ENCRYPTION_MASTER_KEY               required
#   JWT_SECRET                          required
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET   optional (GitHub sign-in)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   optional (Google sign-in)
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET optional
# Local dev: put them in apps/api/.dev.vars (git-ignored).

name = "hushvault-api"
main = "src/index.ts"
# No nodejs_compat: src/ uses WebCrypto only (verified by grep + dry-run build).
compatibility_date = "2026-09-29"

# ---------------------------------------------------------------- local dev --
[vars]
ENVIRONMENT = "development"
WEB_APP_URL = "http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "hushvault-db-local"
database_id = "local-dev-unused"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SECRETS_KV"
id = "local-dev-unused"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true

# ---------------------------------------------------------------------- dev --
# Worker name resolves to `hushvault-api-dev` (set explicitly so the dashboard
# Worker name always matches this file, which Workers Builds requires).
[env.dev]
name = "hushvault-api-dev"
# Keep the *.workers.dev URL as a fallback while the custom domain is set up.
workers_dev = true

[env.dev.vars]
ENVIRONMENT = "development"
# Key ring: which KEK version new writes use. v1 = ENCRYPTION_MASTER_KEY; vN = secret
# ENCRYPTION_KEY_V<N>. Change this in git (after the new key secret exists) to rotate;
# see docs/ENCRYPTION.md "Key rotation".
ENCRYPTION_ACTIVE_KEY_VERSION = "v1"
# Sender address for transactional mail (issue #26). Must belong to a domain onboarded to
# Cloudflare Email Service (issue #75).
MAIL_FROM = "no-reply@hushvault.dev"
# Used for OAuth redirects, share-link URLs and as an allowed CORS origin.
WEB_APP_URL = "https://beta.hushvault.dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "hushvault-db-dev"
database_id = "3bab0adc-c28b-474f-8e39-810657ecae0b"
migrations_dir = "migrations"

[[env.dev.kv_namespaces]]
binding = "SECRETS_KV"
id = "1b201413240a4b1583d06d135d0c5ee9"

[[env.dev.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Durable Object migrations are applied per environment (each env is a separate
# Worker with its own DO namespace); env-level migrations override top-level.
[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[env.dev.observability]
enabled = true

# Cron Trigger that drives key rotation (idle ticks do two single-row reads). Triggers are
# non-inheritable like bindings, so each env declares its own.
[env.dev.triggers]
crons = ["* * * * *"]

# Cloudflare Email Service send binding (issue #26, #76). DISABLED until the sending domain is
# onboarded (issue #75). Enabled for dev; production stays commented until the #26 code and
# migrations 0006-0008 are rolled out there. `allowed_sender_addresses` pins the binding to MAIL_FROM.
[[env.dev.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["no-reply@hushvault.dev"]

# Single-level subdomain on purpose: I believe Cloudflare's free universal
# certificate covers only one subdomain level (api.beta.hushvault.dev could need
# a paid certificate) — unverified, please check. The zone must be in the same
# account and the deploy token needs Zone > Workers Routes > Edit.
[[env.dev.routes]]
pattern = "api-beta.hushvault.dev"
custom_domain = true

# --------------------------------------------------------------- production --
[env.production]
name = "hushvault-api"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"
# See [env.dev.vars]: active KEK version for new writes.
ENCRYPTION_ACTIVE_KEY_VERSION = "v1"
MAIL_FROM = "no-reply@hushvault.dev"
WEB_APP_URL = "https://hushvault.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "hushvault-db"
database_id = "f160554b-5c2e-4cdd-89e3-7f4315ce351c"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "SECRETS_KV"
id = "51f1ef71e8c540509a782c858fb025e8"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["* * * * *"]

# Cloudflare Email Service send binding (issue #26, #76). DISABLED until the sending domain is
# onboarded (issue #75): uncomment, then deploy. Without it the code sends nothing and the auth
# endpoints still respond normally. `allowed_sender_addresses` pins the binding to MAIL_FROM.
# [[env.production.send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["no-reply@hushvault.dev"]

# Custom domain: Cloudflare creates the DNS record + certificate on deploy. The
# zone must be in the same account and the deploy token needs Zone > Workers
# Routes > Edit for it. Remove this block (and set workers_dev = true above) if
# hushvault.dev is not in the account.
[[env.production.routes]]
pattern = "api.hushvault.dev"
custom_domain = true
