name: HushVault Secrets
description: Load secrets from a HushVault environment into a workflow using GitHub OIDC (no stored HushVault token).
author: HushVault
branding:
  icon: lock
  color: purple
inputs:
  api-url:
    description: HushVault API base URL.
    required: false
    default: https://api.hushvault.dev
  environment-id:
    description: The HushVault environment id to read (env_...). An admin must have granted this repository access to it.
    required: true
  audience:
    description: OIDC audience to request. Must match the audience the HushVault deployment requires.
    required: false
    default: https://api.hushvault.dev
  export-env:
    description: >-
      Export each secret as an environment variable for later steps. Requires either "prefix" or "names", so that you
      decide which variables this job gets rather than whoever can add a secret to the environment.
    required: false
    default: 'true'
  prefix:
    description: >-
      Prefix applied to exported variable names; must end with "_" (e.g. APP_). It puts you, not whoever can add a
      secret, in control of which variables this job ends up reading.
    required: false
    default: ''
  names:
    description: >-
      Optional whitespace/comma-separated list of secret names to export. When set, only these are exported and the
      run fails if one is missing — the strongest option, because you choose exactly what enters the environment.
    required: false
    default: ''
outputs:
  names:
    description: JSON array of the secret names that were loaded. Never the values.
runs:
  using: node24
  main: src/index.js
